name: Something's not working
description: A macro or script crashed, or gave a result that looks wrong
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: which
    attributes:
      label: Which macro or script (and version)?
      placeholder: fiji/macros/measure_nuclei.ijm v1.0.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Paste the full text from the Fiji Log window or the terminal.
      render: text
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Settings used, and which image (does it happen on data/sample/ too?)
